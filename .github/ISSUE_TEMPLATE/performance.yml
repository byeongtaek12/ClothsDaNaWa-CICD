name: "⚡ Performance"
description: "성능 개선 작업"
labels: ["performance"]
body:
  - type: textarea
    attributes:
      label: 📄 설명
      description: 성능 개선이 필요한 대상과 현재 문제 상황을 작성해 주세요.
      placeholder: 예) 검색 조회 시 응답 속도가 느리고, 데이터가 많아질수록 지연이 커집니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔍 원인 분석
      description: 현재 확인된 원인이나 의심되는 병목 지점을 작성해 주세요.
      placeholder: 예) LIKE 검색으로 인한 풀스캔 가능성, 불필요한 조인, 인덱스 미적용 등
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      description: 할 일을 체크박스 형태로 작성해주세요.
      placeholder: |
        - [ ] 실행 계획 확인
        - [ ] 병목 구간 측정
        - [ ] 쿼리 개선
        - [ ] 인덱스 적용 검토
        - [ ] 성능 비교 테스트
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🎯 기대 효과
      description: 개선 후 기대하는 결과를 작성해 주세요.
      placeholder: 예) 검색 응답 시간 단축, DB 부하 감소, 사용자 체감 성능 향상

  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 자료가 있다면 작성해 주세요.